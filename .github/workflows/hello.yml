name: Hello World!

on:
  push:
    branches: ["main"]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"
    steps:
      - name: Now it is
        run: |
          echo "Today is $(date)"
    steps:
      - name: Another way tto print the date
        run: |
          date
    steps:
      - name: Directory content
        run: |
          ls -l
